<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2135"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#4d6fc4"/>
    </linearGradient>
  </defs>

  <!-- Big Sur squircle -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#7aa2f7" stroke-opacity="0.14" stroke-width="6"/>

  <!-- faint canvas dot grid -->
  <g fill="#7aa2f7" fill-opacity="0.10">
    <circle cx="260" cy="260" r="10"/><circle cx="512" cy="260" r="10"/><circle cx="764" cy="260" r="10"/>
    <circle cx="260" cy="512" r="10"/><circle cx="764" cy="512" r="10"/>
    <circle cx="260" cy="764" r="10"/><circle cx="512" cy="764" r="10"/><circle cx="764" cy="764" r="10"/>
  </g>

  <!-- S-shaped constellation: nodes + edges -->
  <g stroke="url(#edge)" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M 680 320 L 400 400"/>
    <path d="M 400 400 L 620 590"/>
    <path d="M 620 590 L 350 690"/>
  </g>
  <g>
    <circle cx="680" cy="320" r="74" fill="#7aa2f7"/>
    <circle cx="680" cy="320" r="74" fill="none" stroke="#0d1017" stroke-width="0"/>
    <circle cx="400" cy="400" r="56" fill="#2c3b5e" stroke="#7aa2f7" stroke-width="14"/>
    <circle cx="620" cy="590" r="56" fill="#2c3b5e" stroke="#7aa2f7" stroke-width="14"/>
    <circle cx="350" cy="690" r="74" fill="#7aa2f7"/>
  </g>
</svg>
